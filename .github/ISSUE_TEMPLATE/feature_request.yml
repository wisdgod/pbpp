name: Feature request
description: Propose a capability or a change in behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The concrete situation, not the proposed API.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional — the problem statement matters more.

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: >-
        Existing rules, `@kind` qualifiers, or library APIs that came
        close, and where they fell short.
