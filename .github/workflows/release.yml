name: Release

# Publishes to crates.io when a v* tag is pushed, via crates.io trusted
# publishing (OIDC) — no long-lived token stored in the repo. Enable a
# trusted publisher for this crate/workflow on crates.io first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need main's history to verify the tagged commit

      # A tag alone must not decide what gets published: check that the
      # tag names exactly the manifest version, and that the tagged commit
      # is actually on main (so a tag on an unreviewed branch cannot ship).
      - name: Verify tag against manifest and main
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag '$REF_NAME' does not match Cargo.toml version '$version'"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tagged commit $SHA is not contained in origin/main"
            exit 1
          fi
          echo "publishing $version from $REF_NAME"

      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Re-run the gates from the exact tagged tree before publishing.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --release
      - run: cargo package --locked
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
