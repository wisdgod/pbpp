version: 2

updates:
  # Workflow actions are pinned to commit SHAs, which never float on their
  # own — without this they silently rot (and miss security fixes).
  # Dependabot rewrites both the SHA and its trailing version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
