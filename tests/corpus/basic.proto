// File header comment: this block is separated from the first statement
// by a blank line, so it belongs to the file, not to `syntax`.

syntax = "proto3";

package pbpp.test.v1;

import "google/protobuf/timestamp.proto";
import public "pbpp/test/v1/shared.proto";
import weak "pbpp/test/v1/legacy.proto";

option java_package = "com.example.pbpp.test";
option java_multiple_files = true;
option optimize_for = SPEED;

// Leading comment on Scalars.
message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
}

message Outer {
  // Nested message.
  message Inner {
    string id = 1;

    enum Kind {
      KIND_UNSPECIFIED = 0;
      KIND_A = 1;
      KIND_B = 2;
    }

    Kind kind = 2;
  }

  Inner inner = 1; // trailing comment on a field
  repeated Inner inners = 2;
  optional string note = 3;
  .pbpp.test.v1.Scalars absolute = 4;
  google.protobuf.Timestamp created_at = 5;

  map<string, Inner> by_name = 6;
  map<int64, string> labels = 7;

  oneof payload {
    option (pbpp.test.v1.oneof_opt) = true;

    string text = 8;
    bytes blob = 9;
    Inner structured = 10;
  }

  reserved 100, 101 to 110, 200 to max;
  reserved "old_field", "older_field";

  int32 with_options = 11 [deprecated = true, json_name = "withOptions"];
}

enum Status {
  option allow_alias = true;

  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_DONE = 1;
  STATUS_NEGATIVE = -1;
  STATUS_HEX = 0x10;

  reserved 5, 6 to 9;
  reserved "STATUS_OLD";
}

service Search {
  option deprecated = false;

  rpc Lookup(Outer) returns (Scalars);
  rpc ClientStream(stream Outer) returns (Scalars);
  rpc ServerStream(Outer) returns (stream Scalars);
  rpc BidiStream(stream Outer) returns (stream Scalars);

  rpc WithOptions(Outer) returns (Scalars) {
    option deprecated = true;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
